# System Inspector template.
# Run the future setup wizard before live use. Placeholder interface names are
# intentionally not real macOS BSD names or production IP addresses.
profile:
  name: "SETUP REQUIRED — System Inspector"
  sample_rate: 48000

devices:
  required:
    - id: wing-rack-console
      type: console
      name: "WING Rack"
    - id: playback-mac
      type: computer
      name: "Playback MacBook"
    - id: wing-dante-card
      type: dante_interface
      name: "WING Dante"

roles:
  playback_l:
    expected_source: playback-l-tx
    expected_destination: wing-rx-17
    expected_console_channel: CH17
  playback_r:
    expected_source: playback-r-tx
    expected_destination: wing-rx-18
    expected_console_channel: CH18
  bass:
    expected_source: bass-tx
    expected_destination: wing-rx-19
    expected_console_channel: CH19
  click:
    expected_source: click-tx
    expected_destination: wing-rx-20
    expected_console_channel: CH20
    forbidden_destinations:
      - MAIN-L
      - MAIN-R
  cues:
    expected_source: cues-tx
    expected_destination: wing-rx-21
    expected_console_channel: CH21
    forbidden_destinations:
      - MAIN-L
      - MAIN-R

network:
  dante:
    expected_interface: TO_CONFIGURE_DANTE
    require_wired: true
    allowed_subnets: []
  control:
    expected_interface: TO_CONFIGURE_CONTROL

safety:
  forbidden_routes:
    - source_role: click
      destination_role: main
    - source_role: cues
      destination_role: main
  maximum_main_fader_db: 0
  minimum_headroom_db: 12

