mixer:
  type: wing
  ip: 192.168.1.102
  port: 2223
  send_port: 2222
  receive_port: 2223
  protocol: osc
  tls: false
  midi_base_channel: 0
  keepalive_interval: 5.0
  command_rate_limit: 10.0
  connection_timeout: 10.0
audio:
  sample_rate: 48000
  block_size: 1024
  channels: 64
  source: sounddevice
  device_name: ''
  buffer_seconds: 5.0
  # Точка отвода USB/Dante-сигнала на пульте:
  #   pre_fader  — сигнал ДО фейдера (стабилен, не зависит от фейдера);
  #                auto_fader НЕ компенсирует фейдер. Рекомендуется для автомикса.
  #   post_fader — сигнал ПОСЛЕ фейдера; auto_fader вычитает фейдер (компенсация).
  # Определяется эмпирически: менять фейдер и смотреть, реагирует ли USB-уровень.
  tap_point: "pre_fader"

websocket:
  host: 0.0.0.0
  port: 8765
  max_clients: 10
agent:
  enabled: true
  mode: auto
  cycle_interval: 0.5
  confidence_threshold: 0.6
  max_actions_per_cycle: 5
context_aware_gate:
  enabled: false
  dry_run: true
  live_writes_enabled: false
  threshold_margin_db: 6.0
  min_bleed_score_for_recommendation: 0.35
  min_outlier_score_for_recommendation: 0.35
  high_risk_threshold: 0.68
  max_musical_range_db: 8.0
  max_drum_range_db: 24.0
  safety:
    allow_live_writes: false
    gate_expander_proposal_only: true
    decision_trace_only: true
ai:
  llm_backend: auto
  llm_model: gpt-5.4
  kimi_cli_path: ''
  kimi_work_dir: ''
  kimi_timeout_sec: 120
  model_fallbacks:
  - openai:gpt-5.4
  - kimi_cli:default
  - openai:gpt-4o-mini
  openai_api_key: ''
  openai_url: https://api.openai.com/v1/responses
  openai_reasoning_effort: low
  ollama_url: http://localhost:11434
  perplexity_api_key: ''
  knowledge_dir: ''
safety:
  feedback_detection: true
  max_gain_db: 12.0
  true_peak_limit: -1.0
  max_notch_filters: 8
  max_notch_depth_db: -12.0
autofoh:
  classifier:
    name_overrides:
    - pattern: ^katya$
      source_role: lead_vocal
      confidence: 0.96
    - pattern: ^sergey$
      source_role: lead_vocal
      confidence: 0.96
    - pattern: ^slava$
      source_role: lead_vocal
      confidence: 0.96
    role_overrides:
      lead_vocal:
        priority: 1.0
      unknown:
        allowed_controls:
        - feedback_notch
        - emergency_fader
  analysis:
    fft_size: 4096
    octave_fraction: 3
    slope_compensation_db_per_octave: 4.5
  # Pan v3: профиль PA зала (оператор подтвердил стерео-PA 2026-07-06).
  # mono — консервативный дефолт для незнакомого зала (pan-решение bypass).
  pan:
    pa_type: stereo
    venue_class: club
  # Мастер-петля (директива оператора 2026-07-06): Main LR заведён на
  # USB-отправки 47/48 (/io/out/USB/47|48 grp=MAIN) — проект принимает
  # общий микс и оценивает результат сведения по звучанию. Tap-каналы
  # исключаются из всех коррекций (master-reference правило).
  master_mix:
    enabled: true
    capture_channels: [47, 48]
    capture_seconds: 10.0
    target_curve: live_standard
    target_lufs: -20.0
  detectors:
    monitor_cycle_interval_sec: 1.0
    lead_masking:
      enabled: true
      masking_threshold_db: 3.0
      persistence_cycles: 3
      min_culprit_contribution: 0.35
      lead_boost_db: 0.5
    mud_excess:
      enabled: true
      threshold_db: 2.5
      persistence_cycles: 3
      hysteresis_db: 0.75
    harshness_excess:
      enabled: true
      threshold_db: 2.5
      persistence_cycles: 3
      hysteresis_db: 0.75
    sibilance_excess:
      enabled: true
      threshold_db: 2.5
      persistence_cycles: 3
      hysteresis_db: 0.75
    low_end:
      enabled: true
      sub_threshold_db: 4.0
      bass_threshold_db: 3.0
      body_threshold_db: 2.5
      persistence_cycles: 3
      hysteresis_db: 0.75
      min_culprit_contribution: 0.35
  evaluation:
    enabled: true
    evaluation_window_sec: 2.0
    allow_proxy_audio_evaluation_for_testing: false
    allow_proxy_audio_rollback_for_testing: false
    min_band_improvement_db: 0.25
    min_rms_response_db: 0.1
    worsening_tolerance_db: 0.5
  logging:
    enabled: false
    path: ''
    queue_maxsize: 1024
    write_session_report_on_stop: true
    report_path: ''
  soundcheck_profile:
    enabled: true
    auto_save_after_analysis: true
    auto_load_on_start: true
    capture_multiphase_learning: true
    silence_capture_duration_sec: 0.75
    path: ''
    use_loaded_target_corridor: true
    use_phase_target_action_guards: true
    replace_live_target_with_learned_corridor: true
  live_action_executor:
    enabled: true
    profile_id: show_assist_auto_v1
    require_pre_read: true
    require_readback: true
    rollback_required: true
    auto_rollback_on_readback_failure: true
    demote_on_first_failure: true
    readback_tolerance_db: 0.25
    readback_tolerance_ms: 0.05
    artifact_path: artifacts/show_assist_auto_v1/gated_correction_events.jsonl
    # Промоуты одобрены оператором 2026-07-05 (цель: полный саундчек-режим,
    # все методы коррекции применяются к реальному пульту через gated
    # executor c pre-read/readback/rollback). Мьюты и мастер/DCA/шинные
    # фейдеры остаются proposal-only.
    promoted_action_types:
      ChannelGainMove: true
      ChannelFaderMove: true
      EmergencyFeedbackNotch: true
      BusFaderMove: false
      DCAFaderMove: false
      MasterFaderMove: false
      ChannelEQMove: true
      BusEQMove: false
      HighPassAdjust: true
      CompressorAdjust: true
      BusCompressorAdjust: false
      CompressorMakeupAdjust: true
      BusCompressorMakeupAdjust: false
      GateAdjust: true
      PanAdjust: true
      DelayAdjust: true
      PolarityAdjust: true
      SendLevelAdjust: true
  safety:
    minimum_auto_apply_classification_confidence: 0.75
    new_or_unknown_channel_auto_corrections_enabled: false
    preserve_existing_processing: true
    allow_destructive_reset: false
    allow_input_trim_boost: false
    auto_gate_close_mics: true
    # FX-посылы одобрены оператором 2026-07-06 (цель: полный саундчек-режим).
    # Имена шин на реальном пульте пустые, inserts NONE — мониторных шин в
    # текущей конфигурации зала нет; FX-рэк ставится SETUP-раннером на 13-15.
    auto_fx_sends_enabled: true
    close_mic_fx_sends_enabled: false
    monitor_bus_ids: []
    effect_bus_ids: [13, 14, 15]
    group_bus_correction_enabled: true
    master_reference_channels: [23, 24]
    compressor_gr_max_db: 8.0
    compressor_gr_target_db: 4.0
    compressor_makeup_compensation_ratio: 0.7
    compressor_makeup_max_step_db: 2.0
    compressor_makeup_max_db: 9.0
    compressor_makeup_true_peak_ceiling_db: -3.0
    action_limits:
      channel_fader_max_step_db: 1.0
      channel_fader_min_interval_sec: 3.0
      bus_fader_max_step_db: 1.0
      bus_fader_min_interval_sec: 3.0
      dca_fader_max_step_db: 1.0
      dca_fader_min_interval_sec: 3.0
      lead_fader_max_step_db: 0.5
      lead_fader_min_interval_sec: 2.0
      gain_max_abs_db: 12.0
      gain_min_interval_sec: 3.0
      broad_eq_max_step_db: 1.0
      broad_eq_max_total_db_from_snapshot: 3.0
      broad_eq_min_interval_sec: 5.0
      feedback_notch_max_cut_db: -6.0
      feedback_notch_min_q: 8.0
      feedback_notch_ttl_sec: 120.0
      master_fader_max_cut_db: 1.0
      master_fader_min_interval_sec: 1.0
      delay_max_step_ms: 0.25
      delay_max_ms: 10.0
      delay_min_interval_sec: 3.0
      polarity_min_interval_sec: 3.0
  shared_chat_mix:
    enabled: true
    analysis_window_sec: 8.0
    max_actions_per_pass: 8
    master_peak_ceiling_db: -3.0
    master_max_cut_db: 1.0
    correct_master_output: true
    mirror_eq_enabled: true
    mirror_eq_max_actions_per_pass: 6
    mirror_eq_overlap_tolerance_db: 6.0
    mirror_eq_relative_floor_db: 24.0
    mirror_eq_max_cut_db: -3.0
    mirror_eq_max_boost_db: 1.5
    apply_routing_fixes: false
    rename_generic_channels: false
perceptual:
  enabled: true
  mode: shadow
  backend: mert
  model_name: m-a-p/MERT-v1-95M
  sample_rate: 24000
  window_seconds: 5
  hop_seconds: 2
  evaluate_channels: true
