name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, audio-workbench-mcp-v0.1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Optional Workbench dependencies remain in CI, not the live backend.
          pip install pytest pytest-asyncio "optuna>=4.0"

      - name: Verify backend and Workbench compilation
        run: python -m compileall -q backend mix_agent audio_workbench

      - name: Validate studio metering and offline boundary
        run: >-
          python -m pytest
          tests/test_infrastructure/test_studio_mastering_metrics.py
          tests/test_infrastructure/test_auto_mastering_studio_integration.py
          tests/test_infrastructure/test_studio_mastering_offline_boundary.py
          -q -s --tb=short
        env:
          PYTHONPATH: backend
          OSC_DISABLED: "true"

      - name: Run tests
        run: python -m pytest tests/ -x --tb=short -q
        env:
          PYTHONPATH: backend
          OSC_DISABLED: "true"
