name: Tests

on:
  push:
    branches: [master, live-soundcheck-renovation, 'live-soundcheck-renovation-*']
  pull_request:
    branches: [master, live-soundcheck-renovation]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Existing Workbench optimizer tests exercise the optional integration.
          # Keep the dependency in the test environment, not the live backend.
          pip install pytest pytest-asyncio "optuna>=4.0"

      - name: Verify backend and Workbench compilation
        run: python -m compileall -q backend mix_agent audio_workbench

      - name: Run tests
        run: python -m pytest tests/ -x --tb=short -q
        env:
          PYTHONPATH: backend
          OSC_DISABLED: "true"
