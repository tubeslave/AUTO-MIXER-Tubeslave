name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Archive tested source
        run: git archive --format=zip --output=automixer-audit-source.zip HEAD backend tests mix_agent .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: automixer-audit-source
          path: automixer-audit-source.zip
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify backend compilation
        run: python -m compileall -q backend mix_agent

      - name: Run tests
        run: python -m pytest tests/ -x --tb=short -q
        env:
          PYTHONPATH: backend
          OSC_DISABLED: "true"
