name: Apply Safe DSP Hardening

on:
  push:
    branches: [gpt/dsp-audit-overhaul-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/dsp-audit-overhaul-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic DSP patches
        run: python tools/apply_safe_dsp_hardening.py
      - name: Compile patched DSP modules
        run: |
          python -m py_compile backend/lufs_gain_staging.py
          python -m py_compile backend/signal_metrics.py
          python -m py_compile backend/auto_mastering.py
      - name: Commit patches if needed
        run: |
          if git diff --quiet; then
            echo 'No DSP patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lufs_gain_staging.py backend/signal_metrics.py backend/auto_mastering.py
          git commit -m 'fix: harden DSP metering and mastering'
          git push origin HEAD:gpt/dsp-audit-overhaul-20260907
