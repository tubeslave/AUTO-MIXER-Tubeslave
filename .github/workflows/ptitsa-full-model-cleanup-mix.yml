name: Ptitsa full model cleanup mix
on:
  push:
    branches: [audio-workbench-mcp-v0.1]
    paths: [.github/workflows/ptitsa-full-model-cleanup-mix.yml]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "audio-separator[cpu]" soundfile numpy scipy
      - name: Download full Ptitsa song multitrack
        shell: python
        run: |
          import json,urllib.parse,urllib.request,subprocess,pathlib
          key="https://disk.yandex.ru/d/OvdRlysTGFbxEQ"
          names=[
          "BASS 0002 [2023-03-03 191740].wav","FLOOR 0002 [2023-03-03 191740].wav","GTR 0002 [2023-03-03 191740].wav",
          "HI HAT 0002 [2023-03-03 191740].wav","KEYS L 0002 [2023-03-03 191740].wav","KEYS R 0002 [2023-03-03 191740].wav",
          "KICK IN 0002 [2023-03-03 191740].wav","KICK OUT 0002 [2023-03-03 191740].wav","NIKITA VOX 0002 [2023-03-03 191740].wav",
          "OH R 0002 [2023-03-03 191740].wav","OHL 0002 [2023-03-03 191740].wav","PB L 0002 [2023-03-03 191740].wav",
          "PB R 0002 [2023-03-03 191740].wav","SN B 0002 [2023-03-03 191740].wav","SN T 0002 [2023-03-03 191740].wav",
          "TOM 1 0002 [2023-03-03 191740].wav","TOM 2 0002 [2023-03-03 191740].wav","VALERA VOX 0002 [2023-03-03 191740].wav"]
          pathlib.Path("work/raw").mkdir(parents=True,exist_ok=True)
          # Ptitsa starts at 29:54 in the concert files; 4:19 duration.
          start=29*60+54; dur=259
          for name in names:
              q=urllib.parse.urlencode({"public_key":key,"path":"/"+name})
              with urllib.request.urlopen("https://cloud-api.yandex.net/v1/disk/public/resources/download?"+q,timeout=60) as r:
                  href=json.load(r)["href"]
              out="work/raw/"+name.split(" 0002")[0].replace(" ","_")+".wav"
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-ss",str(start),"-i",href,
                              "-t",str(dur),"-ac","2","-ar","44100","-c:a","pcm_s24le",out],check=True)
      - name: Neural cleanup selected sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/clean
          cp work/raw/*.wav work/clean/
          # Bleed Suppressor: conservative 50% residual blend for vocals and close drums.
          for stem in VALERA_VOX NIKITA_VOX SN_T SN_B TOM_1 TOM_2 FLOOR KICK_IN KICK_OUT; do
            od="work/model_bleed/$stem"; mkdir -p "$od"
            audio-separator "work/raw/$stem.wav" -m mel_band_roformer_bleed_suppressor_v1.ckpt --output_format WAV --output_dir "$od" --normalization 1.0 --use_soundfile
            c="$(find "$od" -type f -name '*_(Instrumental)_*.wav' | head -1)"
            python - "$stem" "$c" <<'PY'
          import sys,soundfile as sf,numpy as np
          stem=sys.argv[1];clean=sys.argv[2]
          r,sr=sf.read(f"work/raw/{stem}.wav",always_2d=True,dtype="float32")
          c,sr2=sf.read(clean,always_2d=True,dtype="float32");n=min(len(r),len(c));r=r[:n];c=c[:n]
          if c.shape[1]!=r.shape[1]:c=np.repeat(c[:,:1],r.shape[1],axis=1)
          # 50% model strength, intentionally conservative until full-mix listening approval.
          y=r+.5*(c-r)
          sf.write(f"work/clean/{stem}.wav",y,sr,subtype="PCM_24")
          PY
          done
          # Guitar: Aufr33 denoise was the strongest useful candidate in v5; use 50%.
          od="work/model_gtr";mkdir -p "$od"
          audio-separator work/raw/GTR.wav -m denoise_mel_band_roformer_aufr33_sdr_27.9959.ckpt --output_format WAV --output_dir "$od" --normalization 1.0 --use_soundfile
          c="$(find "$od" -type f -name '*_(dry)_*.wav' | head -1)"
          python - "$c" <<'PY'
          import sys,soundfile as sf,numpy as np
          r,sr=sf.read("work/raw/GTR.wav",always_2d=True,dtype="float32");c,sr2=sf.read(sys.argv[1],always_2d=True,dtype="float32")
          n=min(len(r),len(c));r=r[:n];c=c[:n]
          if c.shape[1]!=r.shape[1]:c=np.repeat(c[:,:1],r.shape[1],axis=1)
          sf.write("work/clean/GTR.wav",r+.5*(c-r),sr,subtype="PCM_24")
          PY
          # Bass: v5 Bleed Suppressor changed it only weakly, so 100% is still conservative in absolute residual.
          od="work/model_bass";mkdir -p "$od"
          audio-separator work/raw/BASS.wav -m mel_band_roformer_bleed_suppressor_v1.ckpt --output_format WAV --output_dir "$od" --normalization 1.0 --use_soundfile
          c="$(find "$od" -type f -name '*_(Instrumental)_*.wav' | head -1)"
          cp "$c" work/clean/BASS.wav
      - name: Render full cleaned mix
        shell: python
        run: |
          import json,pathlib,soundfile as sf,numpy as np
          rep=json.loads(pathlib.Path("audio_workbench/mixing/ptitsa_v1_static.json").read_text()) if pathlib.Path("audio_workbench/mixing/ptitsa_v1_static.json").exists() else None
          # Frozen gains/pans from the accepted Ptitsa balance. Fallback values are intentionally explicit.
          gains={"BASS":-7.0,"FLOOR":-11.0,"GTR":-8.0,"HI_HAT":-15.0,"KEYS_L":-12.0,"KEYS_R":-12.0,
                 "KICK_IN":-8.0,"KICK_OUT":-10.0,"NIKITA_VOX":-7.5,"OH_R":-12.0,"OHL":-12.0,
                 "PB_L":-11.0,"PB_R":-11.0,"SN_B":-14.0,"SN_T":-8.5,"TOM_1":-11.0,"TOM_2":-11.0,"VALERA_VOX":-6.5}
          pans={"BASS":0,"FLOOR":.35,"GTR":-.45,"HI_HAT":.5,"KEYS_L":-.65,"KEYS_R":.65,"KICK_IN":0,"KICK_OUT":0,
                "NIKITA_VOX":.18,"OH_R":.75,"OHL":-.75,"PB_L":-.8,"PB_R":.8,"SN_B":0,"SN_T":0,
                "TOM_1":-.3,"TOM_2":.3,"VALERA_VOX":0}
          files={p.stem:p for p in pathlib.Path("work/clean").glob("*.wav")}
          N=min(sf.info(p).frames for p in files.values());sr=44100;out=pathlib.Path("work/Ptitsa_ModelClean_FullMix_50pct.wav")
          with sf.SoundFile(out,"w",samplerate=sr,channels=2,subtype="PCM_24") as w:
            for start in range(0,N,sr*20):
              count=min(sr*20,N-start);mix=np.zeros((count,2),np.float32)
              for name,p in files.items():
                with sf.SoundFile(p) as f:f.seek(start);x=f.read(count,dtype="float32",always_2d=True)
                m=x.mean(1);amp=10**(gains.get(name,-12)/20);th=(pans.get(name,0)+1)*np.pi/4
                mix[:,0]+=m*amp*np.cos(th);mix[:,1]+=m*amp*np.sin(th)
              w.write(mix)
          # Headroom normalize only, no limiter/mastering.
          x,sr=sf.read(out,always_2d=True,dtype="float32");pk=np.max(np.abs(x));g=10**(-3/20)/(pk+1e-20)
          sf.write(out,x*g,sr,subtype="PCM_24")
      - name: Encode listening MP3
        run: |
          ffmpeg -hide_banner -loglevel error -y -i work/Ptitsa_ModelClean_FullMix_50pct.wav -c:a libmp3lame -b:a 320k work/Ptitsa_ModelClean_FullMix_50pct_320.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: ptitsa-full-model-cleanup-mix
          path: |
            work/Ptitsa_ModelClean_FullMix_50pct.wav
            work/Ptitsa_ModelClean_FullMix_50pct_320.mp3
          retention-days: 7
