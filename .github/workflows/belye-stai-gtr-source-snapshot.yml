name: Belye Stai GTR source snapshot
on:
  push:
    branches: [studio/guitar-compression-gate-v1-20260924]
    paths: [.github/workflows/belye-stai-gtr-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch public source and extract immutable GTR slice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, urllib.parse, urllib.request, wave
          public='https://disk.yandex.ru/d/OvdRlysTGFbxEQ'
          target='GTR 0002 [2023-03-03 191740].wav'
          api='https://cloud-api.yandex.net/v1/disk/public/resources'
          def get(path):
              q=urllib.parse.urlencode({'public_key':public,'path':path,'limit':1000})
              with urllib.request.urlopen(api+'?'+q, timeout=60) as r: return json.load(r)
          queue=['/']; found=None; seen=set()
          while queue and found is None:
              path=queue.pop(0)
              if path in seen: continue
              seen.add(path)
              obj=get(path)
              for item in obj.get('_embedded',{}).get('items',[]):
                  if item.get('name')==target:
                      found=item['path']; break
                  if item.get('type')=='dir': queue.append(item['path'])
          if found is None: raise SystemExit('target GTR source not found in public tree')
          print('resolved',found)
          q=urllib.parse.urlencode({'public_key':public,'path':found})
          with urllib.request.urlopen(api+'/download?'+q, timeout=60) as r:
              href=json.load(r)['href']
          with urllib.request.urlopen(href, timeout=300) as r, open('out/GTR_full.wav','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          start=45_334_800; frames=9_128_700
          with wave.open('out/GTR_full.wav','rb') as src:
              assert src.getnchannels()==1 and src.getframerate()==44100 and src.getsampwidth()==3
              src.setpos(start); payload=src.readframes(frames)
              assert len(payload)==frames*3
              with wave.open('out/03_GTR.wav','wb') as dst:
                  dst.setparams((1,3,44100,frames,'NONE','not compressed'))
                  dst.writeframes(payload)
          open('out/resolved_path.txt','w').write(found+'\n')
          PY
          test "$(stat -c%s out/03_GTR.wav)" = "27386144"
          printf '%s  %s\n' '5b274178a9afaa53a57ca904f23c8ae814be6c58462a7db669c6e5e27426ed2b' 'out/03_GTR.wav' | sha256sum -c -
          rm out/GTR_full.wav
          sha256sum out/03_GTR.wav > out/03_GTR.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: belye-stai-gtr-raw-immutable
          path: out/
          retention-days: 3
