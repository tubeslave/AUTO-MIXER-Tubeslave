name: Belye Stai GTR source snapshot
on:
  push:
    branches: [studio/guitar-compression-gate-v1-20260924]
    paths: [.github/workflows/belye-stai-gtr-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public source and extract immutable GTR slice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, urllib.parse, urllib.request
          public='https://disk.yandex.ru/d/OvdRlysTGFbxEQ'
          path='/Vavi Live/GTR 0002 [2023-03-03 191740].wav'
          q=urllib.parse.urlencode({'public_key':public,'path':path})
          with urllib.request.urlopen('https://cloud-api.yandex.net/v1/disk/public/resources/download?'+q, timeout=60) as r:
              href=json.load(r)['href']
          with urllib.request.urlopen(href, timeout=180) as r, open('out/GTR_full.wav','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          PY
          ffmpeg -hide_banner -loglevel error -ss 1028 -t 207 -i out/GTR_full.wav -map 0:a:0 -c:a pcm_s24le out/03_GTR.wav
          test "$(stat -c%s out/03_GTR.wav)" = "27386144"
          printf '%s  %s\n' '5b274178a9afaa53a57ca904f23c8ae814be6c58462a7db669c6e5e27426ed2b' 'out/03_GTR.wav' | sha256sum -c -
          rm out/GTR_full.wav
          sha256sum out/03_GTR.wav > out/03_GTR.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: belye-stai-gtr-raw-immutable
          path: out/
          retention-days: 3
